name: Build Linux (AppImage)

on:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'linux/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-linux-appimage.yml'
  # Builds any branch on demand without waiting for a merge.
  workflow_dispatch:

# A newer push to master makes the previous build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'master'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config file wget zsync xvfb \
            xdotool x11-utils binutils \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libfuse2 \
            libwebkit2gtk-4.1-dev
          # GTK4 / WebKit 6 are only needed if the embedder moved on; keep them optional.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev || true

      - name: Flutter pub get
        run: |
          git config --global core.longpaths true
          flutter pub get

      - name: Build Linux release
        run: flutter build linux --release -t lib/src/main.dart

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          BUNDLE="build/linux/x64/release/bundle"
          APPDIR="$PWD/build/linux/AppDir"
          test -x "$BUNDLE/acervo-hc"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          # Flutter's RPATH is $ORIGIN/lib, so acervo-hc + lib/ + data/ stay together.
          cp -a "$BUNDLE/." "$APPDIR/usr/bin/"

          cp linux/assets/app.acervo.hc.desktop "$APPDIR/usr/share/applications/"
          cp linux/assets/app.acervo.hc.desktop "$APPDIR/"

          cp assets/icon/acervo-hc_512.png "$APPDIR/app.acervo.hc.png"
          cp assets/icon/acervo-hc_512.png \
             "$APPDIR/usr/share/icons/hicolor/512x512/apps/app.acervo.hc.png"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/acervo-hc" "$@"
          APPRUN
          chmod 0755 "$APPDIR/AppRun"

          # Report anything the CI image has but a user distro might not.
          echo "--- bundled libs ---"
          ls -1 "$APPDIR/usr/bin/lib" || true
          echo "--- external deps of the runner binary ---"
          readelf -d "$APPDIR/usr/bin/acervo-hc" | grep NEEDED || true
          echo "--- plugin deps that are not bundled ---"
          for so in "$APPDIR"/usr/bin/lib/*.so; do
            echo "== $(basename "$so")"
            readelf -d "$so" | grep NEEDED | grep -v 'libapp.so' || true
          done
          echo "--- unresolved deps (informational) ---"
          ldd "$APPDIR/usr/bin/acervo-hc" | grep -i 'not found' || echo "none"

      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          OUT="build/linux/AcervoHC_${VERSION}_Linux_x64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 VERSION="$VERSION" \
            ./appimagetool --no-appstream --comp zstd \
            build/linux/AppDir "$OUT"

          ls -lh "$OUT"
          file "$OUT"
          echo "APPIMAGE=$OUT" >> "$GITHUB_ENV"

      - name: Smoke test AppImage (headless)
        continue-on-error: true
        run: |
          set +e
          chmod +x "$APPIMAGE"
          cat > smoke.sh <<'SMOKE'
          #!/bin/bash
          APP="$1"
          "./$APP" > smoke.log 2>&1 &
          pid=$!
          found=0
          for i in $(seq 1 40); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then echo "process died after ${i}s"; break; fi
            if xdotool search --pid "$pid" --onlyvisible 2>/dev/null | grep -q .; then
              found=1; echo "window mapped after ${i}s"; break
            fi
          done
          echo "--- windows on the X server ---"
          xwininfo -root -children 2>/dev/null | head -20
          kill "$pid" 2>/dev/null
          wait "$pid" 2>/dev/null
          echo "--- app output ---"
          tail -40 smoke.log
          echo "WINDOW_FOUND=$found"
          SMOKE
          chmod +x smoke.sh
          timeout 90 xvfb-run -a --server-args="-screen 0 1400x900x24" ./smoke.sh "$APPIMAGE"
          echo "smoke exit=$?"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcervoHC-Linux-AppImage
          path: build/linux/*.AppImage
          if-no-files-found: error
          retention-days: 30
